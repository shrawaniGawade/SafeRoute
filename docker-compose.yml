version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: saferoute-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - saferoute-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: saferoute-ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    networks:
      - saferoute-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saferoute-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/saferoute
      - AI_SERVICE_URL=http://ai:8000
      - FRONTEND_URL=http://localhost:5173
      - JWT_ACCESS_SECRET=saferoute_dev_access_secret_key_change_in_production_32chars!
      - JWT_REFRESH_SECRET=saferoute_dev_refresh_secret_key_change_in_production_32chars!
      - COOKIE_DOMAIN=
    depends_on:
      mongo:
        condition: service_healthy
      ai:
        condition: service_healthy
    networks:
      - saferoute-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saferoute-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - saferoute-net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  saferoute-net:
    name: saferoute-network
    driver: bridge

volumes:
  mongo_data:
    name: saferoute_mongo_data
