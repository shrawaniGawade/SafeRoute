services:
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AI_SERVICE_URL=http://ai:8000
      - FRONTEND_URL=http://localhost:5173
      - JWT_ACCESS_SECRET=saferoute_dev_access_secret_key_change_in_production_32chars!
      - JWT_REFRESH_SECRET=saferoute_dev_refresh_secret_key_change_in_production_32chars!
    depends_on:
      - ai
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
